name: Cron — maintenance and warranty reminders

# Calls the protected reminder route once a day (ADR 0009, 0018). The route is
# idempotent, so a manual re-run or a doubled schedule does no harm.
#
# Needs two repository secrets once the app is deployed:
#   APP_URL      e.g. https://kigumi.example.com (no trailing slash)
#   CRON_SECRET  the same value as the app's CRON_SECRET
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  reminders:
    name: Run reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET must be set as repository secrets"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 120 \
            --retry 2 --retry-delay 10 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/reminders"
