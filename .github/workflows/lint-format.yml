name: Lint and Format

on:
  workflow_call:
    inputs:
      fail_on_error:
        description: Whether to fail the workflow if errors are found
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint:
    name: ESLint & Prettier
    runs-on: ubuntu-latest

    # For the real-database tenant isolation suite (npm run test:db).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kigumi
          POSTGRES_PASSWORD: kigumi
          POSTGRES_DB: kigumi
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U kigumi" --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint
        continue-on-error: ${{ !inputs.fail_on_error }}

      - name: Check Prettier formatting
        run: npm run format:check
        continue-on-error: ${{ !inputs.fail_on_error }}

      - name: TypeScript type checking
        run: npx tsc --noEmit
        continue-on-error: ${{ !inputs.fail_on_error }}

      - name: Run unit tests
        run: npm test
        continue-on-error: ${{ !inputs.fail_on_error }}

      - name: Run tenant isolation tests against Postgres
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://kigumi:kigumi@localhost:5433/kigumi_test
        continue-on-error: ${{ !inputs.fail_on_error }}
