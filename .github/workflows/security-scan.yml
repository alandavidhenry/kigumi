name: Security Scan

on:
  workflow_call:
    inputs:
      run_advanced_scans:
        description: Whether to run advanced security scans
        required: false
        type: boolean
        default: false

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so gitleaks scans every commit on the branch.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production dependencies only: the dev-only ESLint toolchain carries an
      # unfixable `braces` advisory (via @next/eslint-plugin-next → fast-glob)
      # that never ships in the app image.
      - name: Run npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Scan for secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose --config .gitleaks.toml

      - name: Run CodeQL Analysis
        if: inputs.run_advanced_scans
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        if: inputs.run_advanced_scans
        uses: github/codeql-action/analyze@v4
